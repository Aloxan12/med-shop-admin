<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Loading...</title>
    <script>
        (function () {
            const fullPath = window.location.pathname;
            const basePath = '/med-shop-admin';

            if (fullPath !== '/' && fullPath !== '/index.html' && !fullPath.startsWith(basePath + '/assets/')) {
                const url = new URL(window.location.href);
                const params = url.search;
                window.history.replaceState({path: fullPath, params}, '', basePath + params);
                window.location.reload();
            } else {
                window.location.pathname = basePath + '/';
            }
        })();
    </script>
</head>
<body>
<div id="root">Loading callback...</div>
<!-- Vite build подхватит -->
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
